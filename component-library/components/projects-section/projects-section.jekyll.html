<!-- begin projects -->
<section class="section projects" id="projects">
  <div class="container">
    <div class="row">
      <div class="col col-12">
        <div class="section__info">
          <div class="section__head">
            <h2 class="section__title">{{ include.title }}</h2>
            <a class="section__link" href="{{ include.link_url | relative_url }}">Смотреть все <i class="ion ion-md-arrow-forward"></i></a>
          </div>
          {{ include.description_html }}
        </div>
      </div>
    </div>
  </div>

  {% if include.show_projects %}
  <div class="container">
    <div class="row">
      {% for project in site.projects %}
        {% if forloop.index <= 6 %}
          {% bookshop project-card project=project %}
        {% endif %}
      {% endfor %}
    </div>
  </div>
  {% endif %}
</section>
<!-- end projects -->
