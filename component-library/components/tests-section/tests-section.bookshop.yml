spec:
  structures:
    - content_blocks
  label: Психологические тесты
  description: Интерактивный каталог психологических тестов с подсчетом результатов
  icon: psychology
  tags:
    - Tests

blueprint:
  disclaimer: >-
    Обратите внимание: онлайн-тесты носят ознакомительный характер и помогают лучше прислушаться к своему состоянию. Они не заменяют очную диагностику специалиста.
  cta_text: Обсудить результат на консультации
  cta_url: /contact/
  tests:
    - id: burnout
      badge: 5 вопросов • 2 минуты
      title: Уровень эмоционального выгорания
      description: Поможет мягко оценить, насколько сильно накопившаяся усталость и напряжение влияют на ваше повседневное состояние.
      questions:
        - text: Как вы обычно чувствуете себя утром в будний день?
          options:
            - label: Просыпаюсь с интересом и силами к предстоящему дню
              score: 0
            - label: Нужно время, чтобы раскачаться, но к обеду вхожу в ритм
              score: 1
            - label: Уже с утра чувствую тяжесть и желание, чтобы день быстрее закончился
              score: 2
        - text: Как вы реагируете на мелкие рабочие или бытовые трудности?
          options:
            - label: Спокойно ищу решение и не застреваю в переживаниях
              score: 0
            - label: Могу понервничать, но довольно быстро восстанавливаю равновесие
              score: 1
            - label: Любая мелочь вызывает сильное раздражение, слезы или полное бессилие
              score: 2
        - text: Хватает ли вам выходных, чтобы по-настоящему отдохнуть?
          options:
            - label: Да, после выходных я чувствую себя обновленным(ой)
              score: 0
            - label: Иногда да, но чаще хочется еще хотя бы один день тишины
              score: 1
            - label: Нет, даже после отдыха остается ощущение хронической усталости
              score: 2
        - text: Как изменился ваш интерес к общению и привычным радостям?
          options:
            - label: С удовольствием встречаюсь с близкими и занимаюсь хобби
              score: 0
            - label: Стараюсь беречь силы и реже соглашаюсь на встречи
              score: 1
            - label: Хочется закрыться от всех, почти ничто не приносит удовольствия
              score: 2
        - text: Насколько легко вам дается концентрация внимания?
          options:
            - label: Легко удерживаю фокус на задачах
              score: 0
            - label: Иногда отвлекаюсь, приходится прилагать больше усилий, чем раньше
              score: 1
            - label: Мысли путаются, даже простые дела требуют огромного напряжения
              score: 2
      results:
        - max_score: 2
          title: Бережный баланс и устойчивость
          text: Сейчас вы хорошо чувствуете свои границы и успеваете восстанавливать силы. Продолжайте поддерживать привычный ритм отдыха и заботы о себе.
        - max_score: 6
          title: Накопившаяся усталость
          text: Похоже, в последнее время вы отдаете больше энергии, чем успеваете восполнить. Это важный сигнал замедлиться, пересмотреть нагрузку и выделить время только для себя.
        - max_score: 10
          title: Выраженное эмоциональное истощение
          text: Ваши внутренние ресурсы сейчас на исходе, и психика сигнализирует о перегрузке. В таком состоянии особенно важна бережная поддержка и пространство, где можно безопасно разделить эту тяжесть.
