name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: "./site"

      - name: Build with Jekyll
        run: bundle exec jekyll build
        working-directory: "./site"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site/_site"

      - name: Deploy mirror to vassa-psychology-ru
        run: |
          rm -rf /tmp/mirror
          cp -r ./site/_site /tmp/mirror
          echo "vassapsychology.ru" > /tmp/mirror/CNAME
          cd /tmp/mirror
          git init
          git config user.name "zomba-ship-it"
          git config user.email "zomba-ship-it@://github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Mirror deploy to vassapsychology.ru"
          git push --force "https://x-access-token:${{ secrets.MIRROR_TOKEN }}@://github.com" gh-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
